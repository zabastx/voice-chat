name: Desktop release

# A Desktop tag from master is the only way in. The guard job proves the tag is
# `desktop-v<semver>` and that its commit is already on master, quality runs the
# repository and Rust gates without any signing material, and only then does the
# release job enter the protected `desktop-release` environment and wait for a
# human approval before it can see the updater key. It creates a draft: publishing
# that draft is the promotion step the Update feed recognises (adr/0014). A
# workflow_dispatch run is the test-only exception: it builds the same draft from
# any branch and skips the master ancestry rule, but still needs the environment
# approval and still only creates a draft.
on:
  push:
    tags:
      - 'desktop-v*'
  # A test-only way in. It builds the same signed draft from any branch, so the
  # workflow can be exercised before the release commit reaches master; a real
  # Release still comes from a `desktop-v*` tag whose commit is on master.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Desktop tag to build as a draft (desktop-v<semver>)'
        required: true
        default: 'desktop-v0.1.0-alpha.1'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a desktop-v tag reachable from master
        id: tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
            echo "::notice::workflow_dispatch test run on $GITHUB_REF; master ancestry is not required for this draft"
          fi
          case "$tag" in
            desktop-v*) ;;
            *)
              echo "::error::Not a Desktop Release tag: $tag"
              exit 1
              ;;
          esac
          version="${tag#desktop-v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::$tag is not desktop-v<semver>"
            exit 1
          fi
          # The ancestry rule is what makes a pushed tag a real Release; a
          # dispatch run is explicitly a draft test and skips it.
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            git fetch --no-tags origin master
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$tag is not reachable from master"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    needs: guard
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Rust checks
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets

      - name: Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  release:
    needs: [guard, quality]
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      contents: write
    env:
      VOICECHAT_DESKTOP_PRODUCTION_ORIGIN: ${{ vars.DESKTOP_PRODUCTION_ORIGIN }}
      VOICECHAT_DESKTOP_UPDATER_PUBKEY: ${{ vars.DESKTOP_UPDATER_PUBKEY }}
      VOICECHAT_DESKTOP_VERSION: ${{ needs.guard.outputs.version }}
      RELEASE_NOTES: desktop/release-notes/${{ needs.guard.outputs.version }}.md
      RELEASE_TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the NSIS installer and Portable EXE
        run: bun run desktop:build

      - name: Sign the NSIS setup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bun scripts/desktop-release.ts sign \
            --notes "$RELEASE_NOTES" \
            > "$RUNNER_TEMP/desktop-binaries.txt"
          cat "$RUNNER_TEMP/desktop-binaries.txt"

      - name: Create the draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t binaries < "$RUNNER_TEMP/desktop-binaries.txt"
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "Voice Chat $VOICECHAT_DESKTOP_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            "${binaries[@]}"

      - name: Publish the updater manifest and checksum for the stored assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A draft whose tag has never been pushed has no git ref, so
          # `releases/tags/<tag>` answers 404 even though `gh release upload
          # <tag>` works. Find the draft in the release list and read it back by
          # id instead. `head` writes into a variable rather than a pipe: under
          # `pipefail` a SIGPIPE from a short read would fail the step.
          release_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft) | .id")"
          release_id="$(printf '%s\n' "$release_ids" | sed -n '1p')"
          if [ -z "$release_id" ]; then
            echo "::error::No draft Release found for $RELEASE_TAG"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            > "$RUNNER_TEMP/desktop-release.json"
          # A draft's html_url is an `untagged-*` slug that dies the moment the
          # Release is published, so the manifest's download root is built from
          # the tag the asset keeps: .../releases/download/<tag>/<name>.
          download_root="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          bun scripts/desktop-release.ts manifest \
            --release "$RUNNER_TEMP/desktop-release.json" \
            --download-root "$download_root" \
            --notes "$RELEASE_NOTES" \
            > "$RUNNER_TEMP/desktop-metadata.txt"
          mapfile -t metadata < "$RUNNER_TEMP/desktop-metadata.txt"
          gh release upload "$RELEASE_TAG" "${metadata[@]}"
