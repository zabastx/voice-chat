[package]
name = "voice-chat"
version = "0.1.0-alpha.1"
description = "Voice Chat desktop client"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }
url = "2.5"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13", features = ["blocking", "json", "query"] }
serde_json = "1"
semver = "1"
url = "2.5"
tauri-plugin-updater = "2.11.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = "=0.61.3"
# The toast and the Application User Model ID it is shown under (#11). Deliberately not
# tauri-plugin-notification: that registers JS commands, and the remote origin is not
# meant to reach a Tauri command at all (adr/0013).
tauri-winrt-notification = "0.8.1"
windows-registry = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
custom-protocol = ["tauri/custom-protocol"]
