[package]
name = "voice-chat-desktop-prototype"
version = "0.25.0"
description = "Windows memory experiment for voice-chat"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[features]
custom-protocol = ["tauri/custom-protocol"]
